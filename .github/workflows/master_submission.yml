name: Numerai Daily Master Pipeline

on:
  schedule:
    # Runs at 13:00 UTC, Tuesday (2) through Saturday (6)
    - cron: '5 13 * * 2-6'
  workflow_dispatch:      # Allows manual trigger button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Give it up to 2 hours
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Master Submission Script
        env:
          NUMERAI_PUBLIC_ID: ${{ secrets.NUMERAI_PUBLIC_ID }}
          NUMERAI_SECRET_KEY: ${{ secrets.NUMERAI_SECRET_KEY }}
        run: python master_submission.py
